<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f2f2f7" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="lfg" />
    <title>lfg</title>
    <script>
      /* Apply the theme class BEFORE first paint, so --background resolves to
         the dark value on the very first frame. Without this, the app's bundled
         CSS (`html { background: var(--background) }`) overrides the inline dark
         rule below but resolves --background to its light default until main.tsx
         adds `.dark` post-bundle — leaving the uncovered bottom safe-area strip
         light for a beat (the "white border" under the splash). Read the saved
         preference here as well so reloads never flash the OS theme first. */
      try {
        var savedTheme = null;
        try {
          savedTheme = localStorage.getItem("lfg_theme");
        } catch (e) {}
        var startsDark =
          savedTheme === "dark" ||
          (savedTheme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(startsDark ? "dark" : "light");
        document.documentElement.style.colorScheme = startsDark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content =
          startsDark ? "#000000" : "#f2f2f7";
      } catch (e) {}
    </script>
    <style>
      /* Paint the shell background on html/body too, not just the splash. A
         fixed element only covers the layout viewport, so on mobile the bottom
         safe-area / overscroll region would otherwise show the browser's default
         white — the "white border at the bottom". Match the theme-color metas so
         every pixel is the same colour before, during, and after the splash. */
      html,
      body {
        margin: 0;
        background: #f2f2f7;
      }
      html.dark,
      html.dark body {
        background: #000;
      }

      /* App shell splash — static markup inside #root so it paints on the very
         first frame (no JS needed) and React replaces it the moment the app
         mounts. Fills the blank white gap on cold loads and on the post-update
         reload so the PWA feels native. Colours mirror the theme-color metas. */
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f2f2f7;
      }
      html.dark #app-splash {
        background: #000;
      }
      #app-splash .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        /* nudge up so it sits optically centered above the home indicator */
        margin-bottom: env(safe-area-inset-bottom, 0px);
      }
      /* Always-visible wordmark so a failed icon fetch is never pure black. */
      #app-splash .splash-wordmark {
        margin: 0;
        font: 600 1.35rem/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: -0.03em;
        color: #f4f4f5;
      }
      html:not(.dark) #app-splash .splash-wordmark {
        color: #1c1c1e;
      }
      #app-splash .splash-logo {
        width: 76px;
        height: 76px;
        border-radius: 18px;
        animation: splash-pulse 1.6s ease-in-out infinite;
      }
      #app-splash .splash-bar {
        position: relative;
        width: 168px;
        height: 4px;
        border-radius: 999px;
        background: rgba(120, 120, 128, 0.2);
        overflow: hidden;
      }
      #app-splash .splash-bar-fill {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: #0a84ff;
        animation: splash-indeterminate 1.15s ease-in-out infinite;
      }
      @keyframes splash-indeterminate {
        0% {
          transform: translateX(-130%);
        }
        100% {
          transform: translateX(360%);
        }
      }
      @keyframes splash-pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.72;
          transform: scale(0.96);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .splash-logo,
        #app-splash .splash-bar-fill {
          animation: none;
        }
        #app-splash .splash-bar-fill {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash" aria-hidden="true">
        <div class="splash-inner">
          <img class="splash-logo" src="/icon.svg" alt="" width="76" height="76" />
          <p class="splash-wordmark">lfg</p>
          <div class="splash-bar"><div class="splash-bar-fill"></div></div>
        </div>
      </div>
    </div>
    <script>
      /* PWA recovery that does NOT depend on the app bundle.
         If a stale installed shell names deleted /assets/* chunks, main.tsx
         never runs — so its service-worker register() + controllerchange
         reload never fire, and the home-screen app stays black forever.
         Register the worker from this inline script, adopt waiting workers,
         and on an entry-module failure wipe shell/asset caches once + reload.
         If the splash is still up after several seconds, show a recovery UI
         instead of an endless black screen (common when the network path to
         the box is down or the entry module never evaluates). */
      (function () {
        var bootRecovering = false;

        function storageGet(key) {
          try {
            return sessionStorage.getItem(key);
          } catch (e) {
            return null;
          }
        }
        function storageSet(key, value) {
          try {
            sessionStorage.setItem(key, value);
            return true;
          } catch (e) {
            return false;
          }
        }

        function purgeShellCaches() {
          if (!("caches" in window)) return Promise.resolve();
          return caches.keys().then(function (keys) {
            return Promise.all(
              keys
                .filter(function (key) {
                  return (
                    key.indexOf("lfg-shell-") === 0 ||
                    key.indexOf("lfg-assets-") === 0
                  );
                })
                .map(function (key) {
                  return caches.delete(key);
                }),
            );
          });
        }

        function hardResetPwa() {
          if (bootRecovering) return;
          bootRecovering = true;
          var chain = purgeShellCaches();
          if ("serviceWorker" in navigator) {
            chain = chain
              .then(function () {
                return navigator.serviceWorker.getRegistrations();
              })
              .then(function (regs) {
                return Promise.all(
                  regs.map(function (reg) {
                    return reg.unregister();
                  }),
                );
              });
          }
          chain
            .catch(function () {})
            .then(function () {
              location.replace("/?pwa_reset=" + Date.now());
            });
        }

        function showStuckSplashRecovery(reason) {
          var splash = document.getElementById("app-splash");
          if (!splash || !splash.parentNode) return;
          // App already replaced the splash.
          if (!document.getElementById("app-splash")) return;
          var root = document.getElementById("root");
          if (!root) return;
          // If React mounted, root no longer contains #app-splash as sole child
          // of a cold document — but createRoot replaces contents, so splash gone.
          if (!document.getElementById("app-splash")) return;

          root.innerHTML =
            '<main style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;gap:0.85rem;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:#000;color:#f4f4f5">' +
            "<h1 style=\"margin:0;font-size:1.15rem;font-weight:600\">lfg did not finish loading</h1>" +
            '<p style="margin:0;max-width:22rem;line-height:1.45;color:#a1a1aa;font-size:.95rem">' +
            (reason ||
              "The app shell is up but the UI never mounted. This is usually a network path to the box (Tailscale) or a broken install.") +
            "</p>" +
            '<p style="margin:0;max-width:22rem;line-height:1.45;color:#71717a;font-size:.8rem">Open this same URL in Safari. If Safari works, delete the home-screen icon and re-add it from Safari.</p>' +
            '<div style="display:flex;flex-wrap:wrap;gap:0.5rem;justify-content:center;margin-top:0.35rem">' +
            '<button type="button" id="lfg-boot-retry" style="appearance:none;border:0;border-radius:999px;padding:.7rem 1.15rem;font:inherit;font-weight:600;background:#0a84ff;color:#fff">Retry</button>' +
            '<button type="button" id="lfg-boot-reset" style="appearance:none;border:0;border-radius:999px;padding:.7rem 1.15rem;font:inherit;font-weight:600;background:#27272a;color:#f4f4f5">Reset install data</button>' +
            "</div></main>";
          var retry = document.getElementById("lfg-boot-retry");
          var reset = document.getElementById("lfg-boot-reset");
          if (retry) retry.onclick = function () {
            location.reload();
          };
          if (reset) reset.onclick = hardResetPwa;
        }

        // Stuck on the black splash with no React mount. Keep this short —
        // "completely black" reports mean users abandon before a 10s wait.
        setTimeout(function () {
          if (!document.getElementById("app-splash")) return;
          if (document.querySelector("[data-startup-state]")) return;
          showStuckSplashRecovery();
        }, 4000);

        if (!("serviceWorker" in navigator)) return;

        // updateViaCache:"none" is load-bearing on iOS. The default lets the
        // HTTP cache satisfy sw.js update checks, so an installed PWA can keep
        // the same dead worker across many deploys and never see recovery code.
        var regPromise = navigator.serviceWorker
          .register("/sw.js", { updateViaCache: "none" })
          .catch(function () {
            return null;
          });

        regPromise.then(function (reg) {
          if (!reg) return;
          if (reg.waiting) reg.waiting.postMessage({ type: "SKIP_WAITING" });
          reg.update().catch(function () {});
        });

        navigator.serviceWorker.addEventListener("message", function (event) {
          if (event.data && event.data.type === "LFG_FORCE_RELOAD") {
            location.reload();
          }
        });

        navigator.serviceWorker.addEventListener("controllerchange", function () {
          // Only reload when we successfully latch — if storage is unavailable,
          // reloading on every controllerchange can spin a black flash loop.
          if (storageGet("lfg:sw-controller-reload") === "1") return;
          if (!storageSet("lfg:sw-controller-reload", "1")) return;
          location.reload();
        });

        window.addEventListener(
          "error",
          function (event) {
            var target = event && event.target;
            if (!target || target.tagName !== "SCRIPT") return;
            var src = target.src || "";
            if (src.indexOf("/assets/") === -1) return;
            var latch = "lfg:boot-recover:" + (src.split("/").pop() || "entry");
            if (storageGet(latch) === "1") {
              showStuckSplashRecovery(
                "The app bundle failed to load even after one recovery try.",
              );
              return;
            }
            if (!storageSet(latch, "1")) {
              showStuckSplashRecovery("The app bundle failed to load.");
              return;
            }
            purgeShellCaches()
              .catch(function () {})
              .then(function () {
                location.reload();
              });
          },
          true,
        );
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
