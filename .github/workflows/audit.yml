name: audit

# GitHub's Dependabot cannot parse bun.lock — it only understands
# package-lock/yarn/pnpm lockfiles. This repo installs exclusively with bun, so
# Dependabot was scanning stale npm lockfiles (since deleted) and was blind to
# the dependency graph we actually ship. This workflow is the replacement: it
# audits the real graph on every push, every PR, and weekly so newly-published
# advisories against unchanged dependencies still surface.
#
# It used to do that with a bare
#   bun audit --audit-level=high --ignore=GHSA-jfgx-wxx8-mp94
# and a comment promising to "drop this ignore as soon as a fixed release
# exists". Nothing checked. The fixed release landed on 2026-06-04 under a
# renamed package (@earendil-works/pi-coding-agent 0.78.1), and the flag went on
# quietly suppressing a live, fixable high-severity advisory for two months
# while this workflow stayed green.
#
# scripts/audit.ts is that promise made executable: exceptions live in
# scripts/audit-exceptions.json with a reason and a hard review date, and the
# gate re-verifies every "no fix exists" claim against the GitHub advisory API
# on each run.
#
# It audits the workspace graph, which covers web/ too: `bun audit` resolves the
# *workspace* lockfile, so running it inside a member directory re-reads the
# root rather than that member's own bun.lock. scripts/audit.ts asserts its
# roots are genuinely distinct rather than letting a duplicate inflate the
# coverage number.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 09:00 UTC — catches advisories published against a graph that
    # hasn't changed, which push/PR runs alone would never notice.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # No `bun install` on purpose: `bun audit` resolves the lockfile directly,
      # so the gate reads exactly what is committed and finishes in seconds.
      - name: Gate on new, expired, stale and now-fixed advisories
        env:
          # Advisory lookups work unauthenticated, but CI shares an IP pool and
          # gets rate-limited fast. This token is read-only here.
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run scripts/audit.ts

      # Always-visible full report, including the lows and the accepted entries,
      # so an accepted exception can never quietly become invisible.
      - name: Full advisory report
        if: always()
        run: |
          {
            echo '## bun audit — full report'
            echo '```'
            bun audit 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
